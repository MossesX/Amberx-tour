<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AmberX Walkthrough</title>
<meta name="description" content="A narrated walkthrough of the AmberX developer tools: AXF, Dev Console, Build Pilot and axHub.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff9a1f'/%3E%3Cpath d='M9 23 16 8l7 15h-4l-3-7-3 7z' fill='%230e0f14'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
<header class="top">
  <span class="logo" aria-hidden="true"></span>
  <h1>AmberX walkthrough</h1>
  <a class="alt" href="slides/">Slideshow</a>
</header>

<main class="wrap">
  <div class="stage">
    <video id="v" controls playsinline preload="metadata" poster="">
      <source src="video/walkthrough.mp4" type="video/mp4">
      <track id="cc" kind="captions" src="video/walkthrough.vtt" srclang="en" label="English" default>
    </video>
    <p id="missing" class="missing" hidden>The video is being recorded. Check back soon, or watch the <a href="slides/">slideshow</a>.</p>
  </div>

  <section class="speed" aria-label="Playback speed">
    <div class="speed__row">
      <label for="rate">Speed</label>
      <input id="rate" type="range" min="0.5" max="2" step="0.05" value="1">
      <output id="rateOut" for="rate">1×</output>
    </div>
    <div class="presets" role="group" aria-label="Speed presets">
      <button data-rate="0.75">0.75×</button>
      <button data-rate="1">1×</button>
      <button data-rate="1.25">1.25×</button>
      <button data-rate="1.5">1.5×</button>
      <button data-rate="2">2×</button>
    </div>
    <label class="cc"><input id="ccOn" type="checkbox" checked> Captions</label>
  </section>

  <section class="index">
    <h2>Chapters</h2>
    <ol id="chapters"></ol>
  </section>
</main>

<script src="js/player.js"></script>
</body>
</html>
